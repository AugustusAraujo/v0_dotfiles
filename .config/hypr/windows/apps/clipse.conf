exec-once = clipse -listen

windowrulev2 = float, title:^(clipse)$
windowrulev2 = center, title:^(clipse)$
windowrulev2 = size 40% 80%, title:^(clipse)$
windowrulev2 = stayfocused, title:^(clipse)$

windowrule = animation slide right, xray, initialTitle:^(clipse)$ 
windowrule = float, initialTitle:^(clipse)$
windowrule = center, initialTitle:^(clipse)$
windowrule = size 1200 800, initialTitle:^(clipse)$
windowrule = opacity 1 0.97, initialTitle:^(clipse)$


bindd = SUPER, T, clipse, exec, ghostty --title="clipse" -e 'clipse'
